services:
  web:
    build: .
    container_name: webdev_library_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: library
      DB_USER: library_user
      DB_PASSWORD: library_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: webdev_library_db
    ports:
      # Expose MariaDB to DBeaver on the host machine.
      # Binding to localhost keeps it inaccessible from other machines.
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: library
      MARIADB_USER: library_user
      MARIADB_PASSWORD: library_password
      MARIADB_ROOT_PASSWORD: change_this_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./library.sql:/docker-entrypoint-initdb.d/library.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
